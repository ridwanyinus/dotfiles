[mgr]
show_hidden    = false

[opener]
open = [
	{ run = "xdg-open %s", desc = "Open" },
]
play = [
  # { run = "mpv %s", orphan = true, for = "unix" },
  { run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
]
pdf = [
  { run = 'okular "$@"', desc = "Okular", orphan = true },
]
cbz = [
  { run = 'okular "$@"', desc = "Okular", orphan = true },
]
epub = [
  { run = 'okular "$@"', desc = "Okular", orphan = true },
]
docx = [
  { run = 'onlyoffice-desktopeditors "$@"', desc = "OnlyOffice" },
]

doc = [
  { run = 'onlyoffice-desktopeditors "$@"', desc = "OnlyOffice" },
]
ott = [
  { run = 'onlyoffice-desktopeditors "$@"', desc = "OnlyOffice" },
]
# extract = [
#   { run = "unzip %s", desc = "Extract here", for = "unix" },
# ]


[open]
prepend_rules = [
  { mime = "application/pdf",  use = "pdf" },
  { url = "*.zip", use = "extract" },   
  { url = "*.7z",  use = "extract" },
  { url = "*.rar", use = "extract" },
  { mime = "application/epub+zip", use = "epub" },
  {url = "*.cbz", use = "cbz"},
  {url = "*.okular", use = "cbz"},
  {url = "*.docx", use = "docx"},
  {url = "*.ott", use = "ott"},
  {url = "*.doc", use = "doc"}
]

