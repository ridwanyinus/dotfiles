# Statusbar plugin options — all defaults use -ogq so user values win

# Flavor: "storm" (default), "night", "neon"
set -ogq @statusbar_flavor "storm"

# Feature toggles: "yes" or "no"
set -ogq @statusbar_pane_dim "yes"
set -ogq @statusbar_pane_borders "yes"
set -ogq @statusbar_popup "yes"
set -ogq @statusbar_messages "yes"

# Status bar background: "theme" (uses @thm_bg) or "none" (transparent)
set -ogq @statusbar_status_background "theme"

# Claude Code session monitoring: "yes" or "no"
set -ogq @statusbar_claude_sessions "no"
