# Statusbar plugin for tmux — main configuration

# ── Load palette ──────────────────────────────────────────────
source -F "#{d:current_file}/themes/cyberpunk#{?#{==:#{@statusbar_flavor},storm},,_#{@statusbar_flavor}}.conf"

# ── Status bar background ─────────────────────────────────────
%if "#{==:#{@statusbar_status_background},none}"
  set -gF status-style "default"
%elif "#{==:#{@statusbar_status_background},theme}"
  set -gF status-style "bg=#{@thm_bg}"
%else
  set -gF status-style "bg=#{@statusbar_status_background}"
%endif

# ── Pane borders ──────────────────────────────────────────────
%if "#{==:#{@statusbar_pane_borders},yes}"
  set -gF pane-border-style "fg=#{@thm_overlay_2}"
  set -gF pane-active-border-style "fg=#{@thm_teal}"
%endif

# ── Pane dimming (inactive panes) ────────────────────────────
%if "#{==:#{@statusbar_pane_dim},yes}"
  set -gF window-style "bg=default,fg=#{@thm_overlay_2}"
  set -gF window-active-style "bg=default,fg=#{@thm_fg}"
%endif

# ── Popup styling ────────────────────────────────────────────
%if "#{==:#{@statusbar_popup},yes}"
  set -gF popup-style "fg=#{@thm_fg},bg=#{@thm_surface_0}"
  set -gF popup-border-style "fg=#{@thm_teal}"
%endif

# ── Message, mode & clock styling ────────────────────────────
%if "#{==:#{@statusbar_messages},yes}"
  set -gF message-style "fg=#{@thm_fg},bg=#{@thm_surface_2}"
  set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_surface_2}"
  set -gF mode-style "fg=#{@thm_bg},bg=#{@thm_teal}"
  set -gF clock-mode-colour "#{@thm_green}"
  set -gF display-panes-active-colour "#{@thm_pink}"
  set -gF display-panes-colour "#{@thm_teal}"
%endif

# ── Statusbar layout ──────────────────────────────────────────
# Glitch-heavy cyberpunk HUD with system gadgets

# @_sb_scripts is set by statusbar.tmux entry point (absolute path)

set -g status-position top
set -g status-justify "absolute-centre"
set -g status-interval 5

# ── Status left: session / dir / git / zoom ──
set -g status-left-length 120
set -g status-left ""

# Prefix-aware session name
set -ga status-left "#{?client_prefix,#[fg=#{@thm_red}]│#[bg=#{@thm_red}#,fg=#{@thm_bg}#,bold] ⌘ #S #[bg=default#,fg=default#,none]#[fg=#{@thm_red}] │ ,#[fg=#{@thm_green}#,dim]│#[bg=#{@thm_red}#,fg=#{@thm_bg}#,bold#,nodim] ⌘ #S #[bg=default#,fg=default#,none]#[fg=#{@thm_green}#,dim] │ }"

# Current directory
set -ga status-left "#[fg=#{@thm_teal},none]  #{b:pane_current_path} "

# Git status
set -ga status-left "#(#{@_sb_scripts}/git_status.sh #{pane_current_path})"

# Zoom indicator
set -ga status-left "#{?window_zoomed_flag,#[fg=#{@thm_green}#,dim] │ #[bg=#{@thm_yellow}#,fg=#{@thm_bg}#,bold] 🔍 ZOOM #[bg=default#,fg=default#,none],}"

# Closing edge
set -ga status-left "#[fg=#{@thm_green},dim] │#[none]"

# ── Windows (centre) ──
set -gF window-status-format "#[bg=default,fg=#{@thm_subtext_0}] ##I:##W "
# set -gF window-status-current-format "#[bg=#{@thm_overlay_1},fg=#{@thm_pink},bold] ##I:##W #[bg=default,none]"
set -gF window-status-current-format "#[bg=#{@thm_peach},fg=#{@thm_bg},bold] ##I:##W #[bg=default,none]"
set -gF window-status-separator "#[fg=#{@thm_overlay_2}]│"

# ── Status right: online / cpu / mem / battery ──
set -g status-right-length 120
set -g status-right ""

# Online indicator
set -ga status-right "#[fg=#{@thm_green},dim]│#[none] #(#{@_sb_scripts}/online.sh)"

# CPU gauge
# set -ga status-right "#[fg=#{@thm_green},dim] │ #[none]#(#{@_sb_scripts}/cpu.sh)"

# Memory gauge
# set -ga status-right "#[fg=#{@thm_green},dim] │ #[none]#(#{@_sb_scripts}/memory.sh)"

# Battery gauge (empty if no battery)
set -ga status-right "#[fg=#{@thm_green},dim] │ #[none]#(#{@_sb_scripts}/battery.sh)"

# Closing edge
set -ga status-right "#[fg=#{@thm_pink},dim] │#[none]"
