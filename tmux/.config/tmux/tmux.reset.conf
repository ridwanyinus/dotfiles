# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
# bind -N "New window (home)" ^C new-window -c "$HOME"
bind -N "Lock server" ^X lock-server
bind -N "Split window horizontally" '"' split-window -c "#{pane_current_path}"
bind -N "Split window vertically" % split-window -hc "#{pane_current_path}"
bind -N "New window (current path)" ^t new-window -c "#{pane_current_path}"
bind -N "Detach client" ^D detach
bind -N "List clients" * list-clients

bind -N "Previous window" H previous-window
bind -N "Next window" L next-window

bind -N "Rename window" r command-prompt "rename-window %%"
bind -N "Last window" ^A last-window
bind -N "List windows" ^W list-windows
bind -N "List windows" w list-windows
bind -N "Zoom pane" z resize-pane -Z
bind -N "Refresh client" ^L refresh-client
bind -N "Refresh client" l refresh-client
bind -N "Split window" | split-window
bind -N "Split window vertically (current path)" s split-window -v -c "#{pane_current_path}"
bind -N "Split window horizontally (current path)" v split-window -h -c "#{pane_current_path}"
bind -N "Choose window" '"' choose-window
bind -N "Select pane left" h select-pane -L
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -r -N "Resize pane left" -T prefix , resize-pane -L 10
bind -r -N "Resize pane right" -T prefix . resize-pane -R 10
bind -r -N "Resize pane down" -T prefix - resize-pane -D 7
bind -r -N "Resize pane up" -T prefix = resize-pane -U 7
bind -N "Command prompt" : command-prompt
bind -N "Toggle synchronize panes" * setw synchronize-panes
bind -N "Toggle pane border status" P set pane-border-status
bind -N "Kill pane" c kill-pane
bind -N "Swap pane down" x swap-pane -D
bind -N "Choose session" S choose-session
bind -N "Reload config" R source-file ~/.config/tmux/tmux.conf
bind -N "Clear screen" K send-keys "clear"\; send-keys "Enter"
bind-key -N "Begin selection (vi)" -T copy-mode-vi v send-keys -X begin-selection

bind-key -N "sesh session manager" "K" run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux -p 90%,80% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --input-border \
    --header-border \
    --header '^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "⌘+^+t join pane" J join-pane -t 1
bind -N "⌘+a ai" A new-window -S -n '󱚣' 'ai'
bind -N "⌘+b builder" b new-window -S -n '󰣪' 'build'
bind -N "⌘+d dev" D new-window -S -n '󰅩' 'dev'
bind -N "⌘+e editor" E new-window -S -n '📝' 'nvim +GoToFile'
bind -N "⌘+l last-session (via sesh)" L run-shell "sesh last"
bind -N "⌘+⇧+Q kill current session" Q kill-session
bind -N "⌘+⇧+R run a script" N split-window -v -l 10 "npm run (jq -r '.scripts | keys[]' package.json | fzf --no-border)"

# vim copy-mode
bind-key -N "Copy selection and cancel" -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind-key -N "Begin selection" -T copy-mode-vi 'v' send -X begin-selection
bind-key -N "Copy selection (no clear)" -T copy-mode-vi y send-keys -X copy-selection-no-clear
bind-key -N "Resize pane left" -T copy-mode-vi M-h resize-pane -L 1
bind-key -N "Resize pane down" -T copy-mode-vi M-j resize-pane -D 1
bind-key -N "Resize pane up" -T copy-mode-vi M-k resize-pane -U 1
bind-key -N "Resize pane right" -T copy-mode-vi M-l resize-pane -R 1
bind-key -N "Jump to previous prompt" -T copy-mode-vi u send-keys -X start-of-line\; send-keys -X search-backward '󱝁 '\; send-keys -X clear-selection\; send-keys -X next-space\; send-keys -X cursor-right
bind-key -N "Jump to next prompt" -T copy-mode-vi d send-keys -X start-of-line\; send-keys -X search-forward '󱝁 '\; send-keys -X clear-selection\; send-keys -X next-space\; send-keys -X cursor-right

# custom keybindings
bind -N "Open editor (C-e)" -n C-e new-window -c "#{pane_current_path}" -n 'editor' "$EDITOR"
bind-key -N "Lazygit popup" C-g display-popup -d "#{pane-current-path}" -w 90% -h 90% -E "lazygit"
bind-key -N "Music player (rmpc) popup" C-m display-popup -w 95% -h 95% -E "rmpc"
