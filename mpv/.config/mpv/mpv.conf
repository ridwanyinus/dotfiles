###########
# GPU API # 
###########
# Controls which type of graphics APIs will be accepted, switch to "d3d11" (on Windows) or "opengl" if you have issues
# Uncomment one API only

###### Vulkan Linux, Windows (preferred)
gpu-api=vulkan

###### DirectX on Windows
# gpu-api=d3d11

###### OpenGL on Linux or macOS or Windows
# gpu-api=opengl
##################
# video settings #
##################

# Start in fullscreen mode by default.
fullscreen=yes

# don't allow a new window to have a size larger than 70% of the screen size
autofit-larger=70%x70%

# Do not close the window on exit.
keep-open=yes

##################
# audio settings #
##################

alang=en
volume-max=200
audio-pitch-correction=yes              # automatically insert scaletempo when playing with higher speed
audio-stream-silence                    # fix audio popping on random seek

##################
# subtitles #
##################

blend-subtitles=no
slang=eng,en

sub-auto=all
# sub-gauss=0.6

sub-scale-by-window=yes

sub-font=Open Sans 
sub-color="#FFFF00"
sub-color=0.9/0.9/0.9/1.0
sub-back-color=0/0/0/0
sub-border-color=0/0/0/1
sub-border-size=1
sub-font-size=25
sub-margin-x=20
sub-margin-y=30
sub-shadow-offset=0

sub-blur=0.3
# sub-border-color=0.0/0.0/0.0/0.8
# sub-border-size=3.2
sub-color=0.9/0.9/0.9/1.0
# sub-margin-x=100
# sub-margin-y=50
sub-shadow-color=0.0/0.0/0.0/0.25

sub-filter-sdh=yes
sub-filter-regex="♪♪♪"
embeddedfonts=yes				# use embedded fonts for SSA/ASS subs
sub-fix-timing=no                       	# do not try to fix gaps (which might make it worse in some cases). Enable if there are scenebleeds.


###########
# OSC/OSD #
###########

osd-bar=no
osd-font=Noto Sans 
osd-msg3=${time-pos} / ${duration} (${percent-pos}%)\n${time-remaining} left
osd-bar-align-y=-1
osd-bar-w=60.5
osd-bar-h=0.7

############
# YouTube  #
############

ytdl-format=bestvideo[height<=?2160]+bestaudio/best
# ytdl-format=bestvideo[height<=1080]+bestaudio/best

#############################
# Screenshots               #
#############################

screenshot-template="~/Videos/Screens/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-format=png			# Set screenshot format
screenshot-png-compression=4		# Range is 0 to 10. 0 being no compression.
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes		# Same output bitdepth as the video

#############################
# Profiles                  #
#############################

# ao=alsa

##################
# Video Profiles #
##################
video-align-y=0
video-align-x=0
profile=high-quality			# mpv --show-profile=gpu-hq
hwdec=auto-copy		# enable hardware decoding, defaults to 'no'
# hwdec=auto
vo=gpu-next			# GPU-Next: https://github.com/mpv-player/mpv/wiki/GPU-Next-vs-GPU

###### Debanding
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

###### Luma up (uncomment one shader line only)	See: https://artoriuz.github.io/blog/mpv_upscaling.html
glsl-shader="~~/shaders/ravu-zoom-ar-r3-rgb.hook"		# good balance between performance and quality
scale=ewa_lanczos
scale-blur=0.981251

###### Luma down (optional, uncomment shader line if your hardware can support it)
dscale=catmull_rom
correct-downscaling=yes
linear-downscaling=no

###### Chroma up + down (optional, uncomment one shader line only if your hardware can support it)
# glsl-shader="~~/shaders/JointBilateral.glsl"
# glsl-shader="~~/shaders/FastBilateral.glsl"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
cscale=lanczos
sigmoid-upscaling=yes

###### Interpolation
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.05
tscale-clamp=0.0

###### SDR
tone-mapping=bt.2446a

###### HDR
target-colorspace-hint=yes

###### Dither
dither-depth=auto

############
# Playback #
############

deinterlace=no # global reset of deinterlacing to off

[default]
# apply all luma and chroma upscaling and downscaling settings
# apply motion interpolation

##########
# Player #
##########

#input-ipc-server=/tmp/mpvsocket
hr-seek-framedrop=no
# no-resume-playback
border=no				# recommended for ModernX OSC
msg-color=yes
msg-module=yes

##################
# other settings #
##################

save-position-on-quit=yes
keepaspect-window=no
watch-later-options-remove=pause
watch-later-options-remove=fullscreen
osc=no # for thumbnail script

############################
# Protocol Specific Config #
############################

[protocol.http]
hls-bitrate=max # use max quality for HLS streams
cache=yes
no-cache-pause # don't pause when the cache runs low

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http

[4k]
profile=fast
glsl-shaders-clr
interpolation=no
deband=no
hwdec=auto-copy
profile-cond=width >= 2560
