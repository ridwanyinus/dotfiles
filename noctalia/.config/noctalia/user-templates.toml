[templates]

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors-matugen.conf'
post_hook = 'pkill -SIGUSR1 kitty'

[templates.omp_colors]
input_path = '~/.config/matugen/templates/omp_palette.json'
output_path = '~/.config/ohmyposh/colors.json'
post_hook = "jq --slurpfile palette ~/.config/ohmyposh/colors.json '. + $palette[0]' ~/.config/ohmyposh/custom_p10k_lean.omp.json > /tmp/new_theme.json && mv /tmp/new_theme.json ~/.config/ohmyposh/custom_p10k_lean.omp.json"

[templates.nvim]
input_path = '~/.config/nvim/pywal/matugen.lua'
output_path = '~/.cache/wal/base46-dark.lua'

[templates.nvimlight]
input_path = '~/.config/nvim/pywal/matugen.lua'
output_path = '~/.cache/wal/base46-light.lua'

[templates.pywal]
input_path = '~/.config/nvim/pywal/waltemplate'
output_path = '~/.cache/wal/colors'

[templates.rmpc]
input_path = '~/.config/noctalia/templates/rmpc-theme.ron'
output_path = '~/.config/rmpc/themes/current.ron'

[templates.rmpc_custom]
input_path = '~/.config/noctalia/templates/rmpc.ron'
output_path = '~/.config/rmpc/themes/custom.ron'

[templates.lazygit]
input_path = "~/.config/noctalia/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.Telegram]
input_path = "~/.config/noctalia/templates/telegram-colors.tdesktop-theme"
output_path = "~/.config/telegram-desktop/themes/material-you.tdesktop-theme"

[templates.kvantum_kvconfig]
input_path = '~/.config/noctalia/templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = '~/.config/noctalia/templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.tmux]
input_path = '~/.config/noctalia/templates/tmux-colors.conf'
output_path = '~/.config/tmux/generated.conf'
post_hook = 'tmux source-file ~/.config/tmux/generated.conf' 

[templates.sddm-noctalia]
input_path = "/usr/share/sddm/themes/sddm-noctalia/template.conf"
output_path = "/usr/share/sddm/themes/sddm-noctalia/theme.conf"

[config]

[config.custom_colors]
red = { color = "#FF0000", blend = true }
green = { color = "#00FF00", blend = true }
yellow = { color = "#FFFF00", blend = true }
blue = { color = "#0000FF", blend = true }
magenta = { color = "#FF00FF", blend = true }
cyan = { color = "#00FFFF", blend = true }
white = { color = "#FFFFFF", blend = true }

